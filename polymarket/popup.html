<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 220px; padding: 12px; margin: 0; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 8px; width: 100%; padding: 6px; background: #22c55e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    button:hover { background: #16a34a; }
    .saved { color: #16a34a; font-size: 12px; margin-top: 6px; height: 14px; }
    .hint { font-size: 11px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <label for="rate">Курс ₽ за $1</label>
  <input id="rate" type="number" step="0.01" min="0" placeholder="например 95.50">
  <button id="save">Сохранить</button>
  <div class="saved" id="status"></div>
  <div class="hint">Сумма в рублях = shares × курс</div>
  <script src="popup.js"></script>
</body>
</html>
